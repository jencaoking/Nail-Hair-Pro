<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>莓好灵感屋 · 管理后台</title>
  <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg">
  <link rel="stylesheet" href="./css/tokens.css">
  <link rel="stylesheet" href="./css/admin.css">
  <script>
    (function() {
      try {
        var mode = localStorage.getItem('theme_mode') || 'auto';
        var dark = mode === 'dark' || (mode === 'auto' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.setAttribute('data-theme', 'dark');
        document.documentElement.setAttribute('data-theme-setting', mode);
      } catch(e){}
    })();
  </script>
</head>
<body>
  <div id="app"></div>
  <div id="toast-root" aria-live="polite"></div>
  <script type="module" src="./js/admin.js"></script>
</body>
</html>
